[project]
name = "rfg"
version = "0.1.0"
description = "RFG Framework: Retrieval-Feedback-Grounded Multi-Query Expansion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Ronaldinho Vega Centeno Olivera" },
    { name = "Julio Cesar dos Reis" },
    { name = "Allan Mariano de Souza" },
]
keywords = ["information-retrieval", "rag", "query-expansion", "beir", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "accelerate>=1.6.0",
    "transformers>=4.57.0",
    "sentence-transformers>=4.0.2",
    "huggingface-hub>=0.30.2",
    "trl>=0.17.0",
    "bitsandbytes>=0.45.5",
    "qdrant-client",
    "beir",
    "fastembed",
    "mistralai",
    "mistral-common",
    "matplotlib",
    "seaborn",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
cuda = [
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdir_src"]
